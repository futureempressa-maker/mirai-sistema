<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mirai Sistema Interno</title>
</head>
<body style="margin:0;background:#06150a;color:#9be22d;font:600 16px system-ui,sans-serif">
<p id="ld" style="padding:40px;text-align:center">Carregando o sistema Mirai…</p>
<script>
(async function(){
  try{
    var partes=await Promise.all([1,2,3,4,5].map(function(i){return fetch('p'+i+'.txt?v=1').then(function(r){if(!r.ok)throw new Error('parte '+i);return r.text()})}));
    var bin=atob(partes.join('').replace(/\s/g,''));
    var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('ld').textContent='Não foi possível carregar o sistema. Verifique a internet e recarregue a página.';}
})();
</script>
</body>
</html>
