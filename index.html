<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mirai Sistema Interno</title>
</head>
<body style="margin:0;background:#06150a;color:#9be22d;font:600 16px system-ui,sans-serif">
<p id="ld" style="padding:40px;text-align:center">Carregando o sistema Mirai…</p>
<script>
(async function(){
  var pre='v2',n=7;
  try{var v=(await (await fetch('versao.txt?t='+Date.now(),{cache:'no-store'})).text()).trim().split(/\s+/);if(/^v\d+$/.test(v[0])&&+v[1]>0){pre=v[0];n=+v[1]}}catch(e){}
  try{
    var idx=[];for(var i=1;i<=n;i++)idx.push(i);
    var partes=await Promise.all(idx.map(function(i){return fetch(pre+'p'+i+'.txt').then(function(r){if(!r.ok)throw new Error('parte '+i);return r.text()})}));
    var bin=atob(partes.join('').replace(/\s/g,''));
    var bytes=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
    var html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('ld').textContent='Não foi possível carregar o sistema. Verifique a internet e recarregue a página.';}
})();
</script>
</body>
</html>
